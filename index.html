<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>瀬戸織ネーム デザインスタジオ</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;600;700&family=Noto+Sans+JP:wght@400;500;700&family=Shippori+Mincho:wght@500;700&family=Zen+Maru+Gothic:wght@500;700&family=Yuji+Syuku&family=Dancing+Script:wght@600&family=Playfair+Display:wght@600&display=swap" rel="stylesheet" />
<script src="vendor/fabric.min.js"></script>
<script>
/* オフライン対策: ローカルの Fabric.js を優先。読み込めなかった場合のみ CDN を試す(オンライン時)。 */
if (!window.fabric) {
  document.write('<scr' + 'ipt src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.0/fabric.min.js"></scr' + 'ipt>');
}
</script>
<link rel="stylesheet" href="styles.css" />
</head>
<body>

<!-- 上部バー -->
<header class="topbar">
  <div class="brand">
    <span class="logo-mark" aria-hidden="true">
      <svg viewBox="0 0 32 32" width="26" height="26"><rect x="3" y="3" width="26" height="26" rx="7" fill="#b08544"/><path d="M9 11h14M9 16h14M9 21h14" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>
    </span>
    <span class="brand-text">瀬戸織ネーム<small>デザインスタジオ</small></span>
  </div>

  <div class="product-switch" id="productSwitch"></div>

  <div class="topbar-actions">
    <div class="hist-group">
      <button class="icon-btn" id="undoBtn" title="元に戻す" disabled>
        <svg viewBox="0 0 24 24" width="18" height="18"><path d="M9 7L4 12l5 5M4 12h11a5 5 0 0 1 0 10h-1" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button class="icon-btn" id="redoBtn" title="やり直し" disabled>
        <svg viewBox="0 0 24 24" width="18" height="18"><path d="M15 7l5 5-5 5M20 12H9a5 5 0 0 0 0 10h1" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
    <div class="zoom-group">
      <button class="icon-btn" id="zoomOut" title="縮小"><svg viewBox="0 0 24 24" width="18" height="18"><path d="M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
      <span class="zoom-val" id="zoomVal">100%</span>
      <button class="icon-btn" id="zoomIn" title="拡大"><svg viewBox="0 0 24 24" width="18" height="18"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
    </div>
    <button class="text-btn" id="previewBtn" title="シャツやワッペンに付いた仕上がりイメージを確認">
      <svg viewBox="0 0 24 24" width="16" height="16"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2"/></svg>
      プレビュー
    </button>
    <button class="text-btn" id="downloadBtn" title="高解像度の PNG 画像として書き出し">
      <svg viewBox="0 0 24 24" width="16" height="16"><path d="M12 3v12m0 0l-4-4m4 4l4-4M5 21h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      ダウンロード
    </button>
    <button class="text-btn primary" id="orderBtn" title="寸法・色・プリフライトを確認して入稿(瀬戸社の受注画面へ)">
      <svg viewBox="0 0 24 24" width="16" height="16"><path d="M5 12l5 5L20 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      入稿する
    </button>
    <a class="text-btn nav-link" href="orders.html" target="_blank" rel="noopener" title="瀬戸社側の受注キャッチ画面を別タブで開く">
      <svg viewBox="0 0 24 24" width="16" height="16"><path d="M4 5h16v14H4z" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M4 9h16" stroke="currentColor" stroke-width="1.8"/><path d="M8 13h8M8 16h5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      受注画面を開く
    </a>
  </div>
</header>

<div class="poc-strip">これは動作デモ(PoC)です。瀬戸社の6品目の実仕様網羅と入稿前プリフライト(製造可否判定)が中核。本番は印刷完全データ生成・認証・受発注連携・決済を実装します。</div>

<div class="workspace">

  <!-- 左レール -->
  <nav class="rail">
    <button class="rail-tab active" data-rail="templates" title="テンプレート"><svg viewBox="0 0 24 24" width="20" height="20"><rect x="3" y="3" width="8" height="8" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.8"/><rect x="13" y="3" width="8" height="8" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.8"/><rect x="3" y="13" width="8" height="8" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.8"/><rect x="13" y="13" width="8" height="8" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.8"/></svg><span>テンプレート</span></button>
    <button class="rail-tab" data-rail="ai" title="AIでデザインを作る(デモ版)"><svg viewBox="0 0 24 24" width="20" height="20"><path d="M12 3l1.8 4.6L18 9l-4.2 1.4L12 15l-1.8-4.6L6 9l4.2-1.4L12 3Z" fill="currentColor"/><path d="M18.5 14l.8 2 2 .8-2 .8-.8 2-.8-2-2-.8 2-.8.8-2Z" fill="currentColor"/></svg><span>AI生成</span></button>
    <button class="rail-tab" data-rail="text" title="テキスト"><svg viewBox="0 0 24 24" width="20" height="20"><path d="M5 6h14M9 6v13M15 6v13" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg><span>テキスト</span></button>
    <button class="rail-tab" data-rail="shapes" title="図形・アイコン"><svg viewBox="0 0 24 24" width="20" height="20"><circle cx="8" cy="8" r="4" fill="none" stroke="currentColor" stroke-width="1.8"/><rect x="13" y="13" width="8" height="8" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.8"/></svg><span>図形</span></button>
    <button class="rail-tab" data-rail="uploads" title="画像"><svg viewBox="0 0 24 24" width="20" height="20"><rect x="3" y="5" width="18" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="9" cy="10" r="1.6" fill="currentColor"/><path d="M5 17l5-4 4 3 3-2 2 2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg><span>画像</span></button>
    <button class="rail-tab" data-rail="material" title="生地・仕様"><svg viewBox="0 0 24 24" width="20" height="20"><path d="M4 4h16v16H4z" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M4 9h16M4 14h16M9 4v16M14 4v16" stroke="currentColor" stroke-width="1"/></svg><span>生地</span></button>
    <button class="rail-tab" data-rail="gallery" title="マイギャラリー"><svg viewBox="0 0 24 24" width="20" height="20"><path d="M4 5h16v11H4z" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M4 13l4-3 3 2 4-4 5 4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg><span>保存</span></button>
  </nav>

  <!-- レールパネル -->
  <section class="rail-panel" id="railPanel"></section>

  <!-- 中央ステージ -->
  <main class="stage" id="stage">
    <div class="stage-inner" id="stageInner">
      <div class="canvas-shell" id="canvasShell">
        <canvas id="c"></canvas>
        <div class="texture-overlay" id="textureOverlay"></div>
      </div>
    </div>
    <div class="stage-foot" id="stageFoot"></div>
  </main>

  <!-- 右プロパティパネル -->
  <aside class="props" id="props">
    <div class="props-empty" id="propsEmpty">
      <svg viewBox="0 0 24 24" width="40" height="40"><path d="M12 3l2.5 5.5L20 9l-4 4 1 6-5-3-5 3 1-6-4-4 5.5-.5L12 3Z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
      <p>要素を選んで編集</p>
      <span>左の「テキスト」や「図形」から追加するか、キャンバス上の要素をクリックしてください。</span>
    </div>
    <div class="props-body" id="propsBody" hidden></div>
  </aside>
</div>

<!-- 入稿モーダル -->
<div class="modal-back" id="orderModal" hidden>
  <div class="modal">
    <div class="modal-head">
      <h3>入稿スペック確認</h3>
      <button class="icon-btn" id="orderClose"><svg viewBox="0 0 24 24" width="18" height="18"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
    </div>
    <div class="modal-body" id="orderBody"></div>
    <div class="modal-foot">
      <span class="modal-note">本番ではここから印刷完全データ生成・マイページ認証・瀬戸様の受発注連携・決済(プレミアム1,980円/月)へ進みます。</span>
      <button class="text-btn primary" id="orderConfirm">この内容で入稿(デモ)</button>
    </div>
  </div>
</div>

<!-- プレビューモーダル -->
<div class="modal-back" id="previewModal" hidden>
  <div class="modal preview-modal">
    <div class="modal-head">
      <h3>仕上がりプレビュー</h3>
      <button class="icon-btn" id="previewClose"><svg viewBox="0 0 24 24" width="18" height="18"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
    </div>
    <div class="modal-body preview-stage" id="previewStage"></div>
  </div>
</div>

<input type="file" id="fileInput" accept="image/*" hidden />

<script src="app.js"></script>
</body>
</html>
